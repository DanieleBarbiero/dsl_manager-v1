project:
  name: dsl-manager
  default_language: it
  timezone: Europe/Rome
  default_doc_profile: docling.no_images
database:
  path: workspace.sqlite
  wal: true
  foreign_keys: true
logging:
  app_log_path: logs/app.jsonl
  per_run_logs: true
  jsonl: true
  level: INFO
corpus:
  active_dir: corpus/active
  incoming_dir: corpus/incoming
  deleted_dir: corpus/deleted
  ignored_dir: corpus/ignored
ai_handoff:
  outbox_dir: ./ai/outbox
  inbox_dir: ./ai/inbox
  package_format: markdown_plus_json
review:
  default_actor_id: 
  automatic_policies: ["explicit_db_code_unit_only/1","explicit_ddl_column_only/1","explicit_ddl_table_only/1","explicit_excel_named_range_only/1","explicit_excel_region_only/1","explicit_excel_sheet_only/1","explicit_excel_table_only/1","explicit_excel_workbook_only/1","explicit_resolved_ddl_fk_only/1","explicit_xml_form_structure_only/1","explicit_xml_operation_only/1","named_explicit_log_policy_required/1","observed_db_code_dependency_only/1"]
derive:
  rule_set_version: "1"
excel:
  max_file_bytes: 67108864
  max_zip_entries: 20000
  max_uncompressed_bytes: 536870912
  max_compression_ratio: 100
  max_xml_part_bytes: 33554432
  max_sheets: 256
  max_cells: 2000000
  max_regions: 10000
  max_relationships: 50000
  max_output_bytes: 268435456
  worker_timeout_seconds: 300
  worker_memory_bytes: 1073741824
temporal:
  max_evidence_per_source: 100000
  max_intervals_per_subject: 1000
  default_timeformat: date
  unknown_timezone_policy: pending
gexf:
  schema_version: 1.3
  validator_dependency: lxml==6.1.2
ai_selection:
  max_examined_evidence: 100000
  max_selected_evidence: 10000
  max_selected_chars: 10000000
workspace:
  dir: .
