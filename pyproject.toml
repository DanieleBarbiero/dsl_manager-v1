[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "dsl_mngr"
version = "1.1.0"
description = "DSL Manager."
requires-python = ">=3.12,<3.13"
dependencies = [
    "docling==2.97.0",
    "lxml==6.1.2",
]

[project.scripts]
dsl-manager = "dsl_mngr.main:main"

[project.optional-dependencies]
dev = [
    "pytest",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dsl_mngr = [
    "resources/gexf/1.3/*.xsd",
    "resources/gexf/1.3/*.json",
    "resources/gexf/1.3/*.txt",
]

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
testpaths = ["tests"]
